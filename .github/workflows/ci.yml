name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('deps.edn') }}
      # the oracle compares us with the reference decoder sample for sample
      - name: Install flac and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y flac ffmpeg
      - name: Run tests
        run: clojure -M:test
      - name: Lint
        run: clojure -M:lint

  cljs:
    name: nbb run-tests.cljk (ClojureScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g nbb@1.4.210
      # org-microsoft-riff reads the reference decoder's WAV output in the tests
      - name: Fetch the pinned test dependency as a sibling checkout
        run: |
          set -eu
          # the coordinate and its :git/sha sit on separate lines here, so the
          # match has to span them — a single-line grep silently finds nothing
          sha=$(grep -A1 'org-microsoft-riff' deps.edn | grep -o '[0-9a-f]\{40\}' | head -1)
          test -n "$sha"
          git clone --quiet https://github.com/kotoba-lang/org-microsoft-riff.git ../org-microsoft-riff
          git -C ../org-microsoft-riff checkout --quiet "$sha"
          echo "org-microsoft-riff @ $sha"
      - run: nbb run-tests.cljk
